syntax = "proto3";

package gophkeeper.secrets.v1;

option go_package = "github.com/user/gophkeeper/pkg/gen";

import "google/protobuf/timestamp.proto";

// DataKind enumerates the types of stored secrets.
enum DataKind {
  DATA_KIND_UNSPECIFIED = 0;
  DATA_KIND_LOGIN       = 1;
  DATA_KIND_TEXT        = 2;
  DATA_KIND_BINARY      = 3;
  DATA_KIND_CARD        = 4;
}

// SecretsService handles CRUD operations and synchronization of encrypted secrets.
service SecretsService {
  // CreateSecret stores a new encrypted secret.
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse);
  // GetSecret retrieves a single secret by ID.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  // ListSecrets returns all secrets for the authenticated user.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // UpdateSecret overwrites a secret with optimistic locking.
  rpc UpdateSecret(UpdateSecretRequest) returns (UpdateSecretResponse);
  // DeleteSecret soft-deletes a secret.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // SyncSecrets returns secrets modified after a given timestamp.
  rpc SyncSecrets(SyncSecretsRequest) returns (SyncSecretsResponse);
}

// SecretItem represents a single stored secret.
message SecretItem {
  string                     id         = 1;
  string                     name       = 2;
  DataKind                   kind       = 3;
  bytes                      payload    = 4;
  google.protobuf.Timestamp  created_at = 5;
  google.protobuf.Timestamp  updated_at = 6;
  int64                      version    = 7;
  bool                       deleted    = 8;
}

// CreateSecretRequest contains data for creating a new secret.
message CreateSecretRequest {
  string   name     = 1;
  DataKind kind     = 2;
  bytes    payload  = 3;
}

// CreateSecretResponse contains the created secret.
message CreateSecretResponse {
  SecretItem secret = 1;
}

// GetSecretRequest identifies the secret to retrieve.
message GetSecretRequest {
  string id = 1;
}

// GetSecretResponse contains the requested secret.
message GetSecretResponse {
  SecretItem secret = 1;
}

// ListSecretsRequest is empty; the user is derived from the JWT.
message ListSecretsRequest {}

// ListSecretsResponse contains all secrets for the user.
message ListSecretsResponse {
  repeated SecretItem secrets = 1;
}

// UpdateSecretRequest contains updated secret data with version for optimistic locking.
message UpdateSecretRequest {
  string   id       = 1;
  string   name     = 2;
  DataKind kind     = 3;
  bytes    payload  = 4;
  int64    version  = 5;
}

// UpdateSecretResponse contains the updated secret.
message UpdateSecretResponse {
  SecretItem secret = 1;
}

// DeleteSecretRequest identifies the secret to delete with version check.
message DeleteSecretRequest {
  string id      = 1;
  int64  version = 2;
}

// DeleteSecretResponse is empty on success.
message DeleteSecretResponse {}

// SyncSecretsRequest specifies the timestamp for delta synchronization.
message SyncSecretsRequest {
  google.protobuf.Timestamp since = 1;
}

// SyncSecretsResponse contains modified secrets and the server timestamp.
message SyncSecretsResponse {
  repeated SecretItem secrets         = 1;
  google.protobuf.Timestamp server_time = 2;
}
